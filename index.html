<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album Ratings Poster</title>
<link rel="stylesheet" href="style.css"
</head>
<body>

<input type="file" id="file-input" accept="application/json,.json">
<button id="load-btn">Load JSON</button>

<div id="empty-state">
  <div class="big">No album loaded</div>
  <div>Drag & drop a JSON file anywhere, or use the "Load JSON" button</div>
</div>

<div class="poster hidden">

  <!-- ============ LEFT: COVER + META (edit freely) ============ -->
  <div>
    <div class="cover-wrap">
      <img id="cover-img" src="https://placehold.co/500x500/1a1c1e/f2f0ea?text=Album+Art" alt="Album cover">
    </div>
    <div class="meta">
      <div class="score">
        <span class="star">★</span> <span id="overall-score">–</span>
      </div>
      <h1 id="album-title">–</h1>
      <div class="artist" id="album-artist"></div>
      <div class="year" id="album-year"></div>
    </div>
  </div>

  <!-- ============ RIGHT: LEGEND + TRACKLIST (data-driven) ============ -->
  <div>
    <div class="legend">
      <span><i class="dot cinema"></i>Absolute Cinema</span>
      <span><i class="dot awesome"></i>Awesome</span>
      <span><i class="dot great"></i>Great</span>
      <span><i class="dot good"></i>Good</span>
      <span><i class="dot regular"></i>Regular</span>
      <span><i class="dot bad"></i>Bad</span>
      <span><i class="dot garbage"></i>Garbage</span>
    </div>
    <div id="tracklist" class="tracklist"></div>
    <div class="notes">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </div>
  </div>

</div>

</body>
</html>

<script src="code.js"></script>
